name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release mid-flight: a half-published tag leaves the GitHub Release
  # created but npm unpublished.
  cancel-in-progress: false

# Permissions are granted per job rather than workflow-wide, so the npm job never holds
# a token that can write to the repository.
permissions:
  contents: read

jobs:
  # ===========================================
  # Build JAR and create GitHub Release
  # ===========================================
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Required to sign the JAR's build provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      # The tag is the single source of version truth: without this the JAR keeps whatever
      # the committed pom says and reports a stale version through MCP serverInfo.
      - name: Set version from tag
        run: ./mvnw -B versions:set -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false

      - name: Build JAR
        run: ./mvnw package -B -Dquarkus.package.jar.type=uber-jar

      # The uber-jar is only assembled here, so this is the first time its merged service
      # files are exercised. Starting it once catches a packaging break before release.
      - name: Smoke test the uber-jar
        run: |
          mv target/*-runner.jar target/mcp-redhat-kb.jar
          REDHAT_TOKEN=smoke-test timeout 60 java \
            -Dquarkus.http.host-enabled=false \
            -Dquarkus.mcp.server.stdio.enabled=true \
            -Dquarkus.banner.enabled=false \
            -jar target/mcp-redhat-kb.jar > /tmp/smoke.json 2>/tmp/smoke.err <<'EOF' || true
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}
          EOF
          grep -q '"serverInfo"' /tmp/smoke.json || {
            echo "::error::the packaged JAR did not complete an MCP handshake"
            cat /tmp/smoke.err
            exit 1
          }
          echo "Handshake OK: $(cat /tmp/smoke.json | head -c 200)"

      # The npm launcher refuses to execute a JAR whose digest is not listed here, so this
      # file is a required release asset, not an optional convenience.
      - name: Generate checksums
        run: |
          cd target
          sha256sum mcp-redhat-kb.jar > checksums.txt
          cat checksums.txt

      # Signed provenance for the JAR, so consumers can verify it was built by this
      # workflow from this commit rather than uploaded by hand.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/mcp-redhat-kb.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            LICENSE
            target/mcp-redhat-kb.jar
            target/checksums.txt

  # ===========================================
  # Publish to npm
  # ===========================================
  publish-npm:
    needs: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # Required for npmjs OIDC trusted publishers
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Keep the job's token out of .git/config while npm lifecycle scripts run.
          persist-credentials: false

      # Ensure npm 11.5.1 or later is installed (required for https://docs.npmjs.com/trusted-publishers)
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Update version in package.json
        run: |
          cd npm
          VERSION=${GITHUB_REF_NAME#v}
          npm version $VERSION --no-git-tag-version --allow-same-version

      # Publishes with NPM_TOKEN. Trusted publishing (OIDC) would avoid the long-lived
      # credential, but it requires registering this repository as a trusted publisher for
      # the package on npmjs.com; until that is done the registry answers 404 to the PUT.
      # Provenance is still signed and recorded either way.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::NPM_TOKEN is not configured; cannot publish to npm."
            exit 1
          fi
          cd npm
          npm publish --provenance --access public
