name: mcpchecker MCP Evaluation

on:
  schedule:
    - cron: '0 9 * * 1'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task-filter:
        description: 'Regular expression to filter tasks (optional)'
        required: false
        default: ''
      verbose:
        description: 'Enable verbose output'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'issue_comment' && format('pr-{0}', github.event.issue.number) || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  MCPCHECKER_VERSION: 'v0.0.4'

defaults:
  run:
    shell: bash

jobs:
  check-trigger:
    name: Check if evaluation should run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/run-mcpchecker'))
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      pr-sha: ${{ steps.check.outputs.pr-sha }}
      is-pr: ${{ steps.check.outputs.is-pr }}
    steps:
      - name: Check trigger conditions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            PERMISSION=$(gh api "repos/$REPO/collaborators/$COMMENT_USER/permission" --jq '.permission')
            if [[ "$PERMISSION" != "admin" && "$PERMISSION" != "write" ]]; then
              echo "::warning::@$COMMENT_USER does not have write access; ignoring /run-mcpchecker"
              echo "should-run=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            # One API call for everything we need about the PR. The head SHA is
            # captured HERE, before any human approval, and the evaluation job checks
            # out exactly this SHA — commits pushed after the label/approval do not
            # sneak into the run.
            PR_JSON=$(gh pr view "$ISSUE_NUMBER" --repo "$REPO" \
              --json headRefOid,isCrossRepository,labels)
            PR_SHA=$(jq -r '.headRefOid' <<<"$PR_JSON")
            IS_FORK=$(jq -r '.isCrossRepository' <<<"$PR_JSON")
            HAS_LABEL=$(jq -r '.labels | map(.name) | contains(["safe-to-eval"])' <<<"$PR_JSON")

            # The evaluation job builds and RUNS the PR's code (mvnw, pom.xml, Maven
            # plugins) with production secrets in the environment. "Someone with write
            # commented /run-mcpchecker" is not the same statement as "a maintainer
            # reviewed THIS diff and considers it safe to execute" — the label makes
            # the second statement explicit, and for fork PRs (fully attacker-authored
            # code) it is non-negotiable. The label can be re-applied after new pushes;
            # combined with the pinned SHA above and the environment approval on the
            # run-evaluation job, a stale label cannot execute unreviewed code alone.
            if [[ "$HAS_LABEL" != "true" ]]; then
              echo "::warning::PR #$ISSUE_NUMBER lacks the 'safe-to-eval' label (fork: $IS_FORK). A maintainer must review the diff and apply the label before /run-mcpchecker runs."
              echo "should-run=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [[ "$IS_FORK" == "true" ]]; then
              echo "::notice::PR #$ISSUE_NUMBER comes from a fork; evaluation requires environment approval before secrets are exposed."
            fi

            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "is-pr=true" >> $GITHUB_OUTPUT
            echo "pr-sha=$PR_SHA" >> $GITHUB_OUTPUT
          else
            # schedule / workflow_dispatch run already-merged code from the default
            # branch: no label, no approval — they must stay frictionless.
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "is-pr=false" >> $GITHUB_OUTPUT
            echo "pr-sha=$SHA" >> $GITHUB_OUTPUT
          fi

  run-evaluation:
    name: Run MCP Evaluation
    needs: check-trigger
    if: needs.check-trigger.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR-triggered runs execute code from the PR head (mvnw, pom.xml, Maven plugins
    # all run arbitrary code at build time) with REDHAT_TOKEN / MODEL_KEY /
    # JUDGE_API_KEY in scope. The 'mcp-eval' environment forces a human to approve
    # the run in the Actions UI *after* seeing which SHA will execute — this is the
    # hard gate; the label check upstream is only a review convention.
    #
    # MANUAL SETUP REQUIRED (Settings > Environments > mcp-eval):
    #   1. Create the environment 'mcp-eval'.
    #   2. Add the protection rule "Required reviewers" with the maintainers.
    # Secrets stay at repository level ON PURPOSE: the schedule/workflow_dispatch
    # path runs without an environment and still needs them. The protection works
    # anyway because a job bound to a reviewed environment does not START (no
    # checkout, no build, no secret injection) until a reviewer approves it.
    # If the environment does not exist, GitHub auto-creates it WITHOUT reviewers on
    # first use and the protection is nominal — this comment exists so that state is
    # recognized as a misconfiguration, not as "working".
    #
    # schedule / workflow_dispatch run already-merged code, so they resolve to the
    # empty string, which GitHub treats as "no environment": no approval friction.
    environment: ${{ needs.check-trigger.outputs.is-pr == 'true' && 'mcp-eval' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.check-trigger.outputs.pr-sha }}

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build MCP server
        run: ./mvnw package -DskipTests -B

      - name: Download mcpchecker
        run: |
          curl -sL "https://github.com/mcpchecker/mcpchecker/releases/download/${{ env.MCPCHECKER_VERSION }}/mcpchecker-linux-amd64.zip" -o mcpchecker.zip
          unzip mcpchecker.zip
          mv mcpchecker-linux-amd64 mcpchecker
          chmod +x mcpchecker
          ls -la mcpchecker

      - name: Start MCP server
        run: |
          # Streamable HTTP transport on /mcp (port 9081).
          java -jar target/quarkus-app/quarkus-run.jar > server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Readiness is probed against the real /mcp endpoint rather than
          # /q/health/ready: quarkus-smallrye-health is NOT a dependency of this
          # project, so that endpoint 404s, the `until` loop never succeeded and the
          # wait silently burned its full timeout on every run.
          #
          # The probe asserts that /mcp ANSWERS, not that the call succeeds. An
          # unauthenticated POST is refused by the `mcp` permission policy (403, or
          # 401 with OIDC enabled) and that is a perfectly good readiness signal: it
          # proves the HTTP transport is up and routing, which is what mcpchecker
          # needs next. Requiring 200 would instead pin this probe to the auth
          # posture and break the moment it changes -- McpAuthenticationTest is what
          # guards the refusal itself.
          #
          # A plain `until` swallows the failure mode, so the loop ends in an explicit
          # exit 1 with the server log: a server that dies at startup must fail this
          # step loudly instead of leaving mcpchecker to report confusing tool errors.
          for i in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::MCP server process died during startup"
              cat server.log
              exit 1
            fi

            # %{http_code} with -o /dev/null: any HTTP status means the port is
            # serving. curl exits non-zero only when it cannot connect at all.
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST http://localhost:9081/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-readiness","version":"1"}}}' \
              2>/dev/null) || STATUS=000

            if [[ "$STATUS" != "000" ]]; then
              echo "MCP server ready after ${i}s (/mcp answered HTTP $STATUS)"
              exit 0
            fi
            sleep 1
          done

          echo "::error::MCP server did not answer on /mcp within 30s"
          cat server.log
          exit 1
        env:
          REDHAT_TOKEN: ${{ secrets.REDHAT_TOKEN }}

      - name: Run mcpchecker evaluation
        id: mcpchecker
        env:
          TASK_FILTER: ${{ github.event.inputs.task-filter }}
          VERBOSE: ${{ github.event.inputs.verbose }}
          # Model driving the evaluations, as "provider:model-id". Configure the EVAL_MODEL
          # repository variable to point at your own endpoint (for example an OpenShift AI
          # deployment); the agent file's default applies when it is unset.
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
          MODEL_KEY: ${{ secrets.MODEL_KEY }}
          JUDGE_BASE_URL: ${{ secrets.JUDGE_BASE_URL }}
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
          JUDGE_MODEL_NAME: ${{ secrets.JUDGE_MODEL_NAME }}
        run: |
          # mcpchecker does not expand variables inside its YAML, so the override is
          # applied to the file before the run. yq edits the document structurally, so a
          # value containing a colon cannot corrupt the file.
          if [[ -n "$EVAL_MODEL" ]]; then
            echo "::notice::Using eval model $EVAL_MODEL"
            yq -i ".builtin.model = \"${EVAL_MODEL}\"" evals/agent/agents.yaml
          fi
          echo "Eval model: $(yq '.builtin.model' evals/agent/agents.yaml)"

          # Built as an array: a filter carrying spaces or globs must reach the binary as
          # one argument rather than being re-split by the shell.
          args=(check evals/agent/eval.yaml --output-format json)

          if [[ -n "$TASK_FILTER" ]]; then
            args+=(--task-filter "$TASK_FILTER")
          fi

          if [[ "$VERBOSE" == "true" ]]; then
            args+=(--verbose)
          fi

          echo "Running: ./mcpchecker ${args[*]}"
          ./mcpchecker "${args[@]}" | tee mcpchecker-results.json || true

          # Extract results for summary
          if [[ -f mcpchecker-results.json ]]; then
            echo "## mcpchecker Results" >> $GITHUB_STEP_SUMMARY
            cat mcpchecker-results.json >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mcpchecker-results
          # The server log ships too: when a run fails at startup or mid-evaluation,
          # it is the only record of why.
          path: |
            mcpchecker-results.json
            server.log
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          # Kill the PID captured at startup; the pkill pattern is a fallback for the
          # case where the readiness step failed before exporting it.
          if [[ -n "${SERVER_PID:-}" ]]; then
            kill "$SERVER_PID" 2>/dev/null || true
          else
            pkill -f quarkus-run.jar || true
          fi
