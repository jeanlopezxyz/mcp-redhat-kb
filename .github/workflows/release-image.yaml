name: Release Container Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Keep the job token out of .git/config while build tooling runs.
          persist-credentials: false

      - name: Set image name to lowercase
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Manual runs are not tagged releases, so the semver patterns yield nothing and
            # the build would fail with no tag to push. Fall back to the commit SHA.
            type=sha,format=long,enable=${{ github.event_name == 'workflow_dispatch' }}

      # Built locally first so the vulnerability scan is a gate rather than a report:
      # scanning after the push would leave a flagged image already serving under `latest`.
      # The tag deliberately carries no registry prefix, otherwise Trivy resolves it as a
      # remote reference and fails to find an image that has not been pushed yet.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # Note: arm64 disabled due to QEMU/Maven wrapper compatibility issues
          platforms: linux/amd64
          push: false
          load: true
          tags: mcp-redhat-kb:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run through the CLI rather than the action: a single invocation both prints the
      # findings and writes SARIF, and it reads the image straight from the local daemon.
      # Two action steps over the same local image do not work -- the second resolves the
      # reference remotely and fails on an image that has not been pushed yet.
      #
      # Vulnerabilities only. The secret scanner flags the placeholder credentials shipped
      # in the base image's /etc/maven/settings.xml ("proxypass", "repopwd"), which would
      # block the gate on findings that are not secrets.
      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            aquasec/trivy:0.69.3 image \
              --scanners vuln \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --format table \
              mcp-redhat-kb:scan

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            aquasec/trivy:0.69.3 image \
              --scanners vuln \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --format sarif \
              --output trivy.sarif \
              --exit-code 1 \
              mcp-redhat-kb:scan

      # Only reached when the scan passes. Layers are cached from the build above, so this
      # republishes rather than rebuilds.
      - name: Push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Supply-chain attestations: provenance records how the image was built and the
          # SBOM lists what is in it, so consumers can audit both.
          provenance: mode=max
          sbom: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@38b3b7bf288d49ccf58644769dc7a6afdccd05eb # v3
        if: always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-mcp-redhat-kb
