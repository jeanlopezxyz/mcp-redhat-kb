# =============================================================================
# Red Hat Knowledge Base MCP Server Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Application Settings
# -----------------------------------------------------------------------------
quarkus.application.name=redhat-kb-mcp
# The version is intentionally not set here: Quarkus takes it from the Maven project, which
# the release workflow stamps from the git tag. Pinning it here would report a stale
# version through MCP serverInfo.

# -----------------------------------------------------------------------------
# HTTP Server Configuration
# -----------------------------------------------------------------------------
quarkus.http.port=9081

# Bind to loopback by default. This server holds a Red Hat offline token and exposes no
# authentication of its own, so anyone who can reach the port can spend your subscription.
# Container images override this to 0.0.0.0 (see Dockerfile), where the network boundary
# is the pod/NetworkPolicy rather than the interface.
quarkus.http.host=127.0.0.1

# The Streamable HTTP transport requires the CORS filter to be enabled, but the origin
# list is never a wildcard: `*` would let any website drive these tools through a user's
# browser. Set MCP_ALLOWED_ORIGINS to the exact origins of your clients.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${MCP_ALLOWED_ORIGINS:http://localhost:6274}
quarkus.http.cors.methods=GET,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization,X-Red-Hat-Token,Mcp-Session-Id,MCP-Protocol-Version,Mcp-Method,Mcp-Name
quarkus.http.cors.exposed-headers=Mcp-Session-Id,WWW-Authenticate

# -----------------------------------------------------------------------------
# MCP Server Configuration
# -----------------------------------------------------------------------------
# Traffic logging dumps full JSON-RPC messages (queries and article content) to the log.
# Off by default; enabled only in dev below.
quarkus.mcp.server.traffic-logging.enabled=false
quarkus.mcp.server.traffic-logging.text-limit=1000

# Cache hints for server/discover (specification 2026-07-28). The tool catalogue is static,
# so clients can cache it and skip a round trip per session.
quarkus.mcp.server.discover.ttl-ms=300000
quarkus.mcp.server.discover.cache-scope=public

# -----------------------------------------------------------------------------
# Authentication - OAuth 2.1 Resource Server (Keycloak)
# -----------------------------------------------------------------------------
# This server is a resource server, never an authorization server: Keycloak issues the
# tokens and this application only validates them.
#
# Disabled by default so stdio (a local, single-user transport where the OS process
# boundary is the trust boundary) works without a Keycloak. ENABLE IT for any HTTP
# deployment: without it, anyone who reaches the port spends your Red Hat subscription.
quarkus.oidc.enabled=${MCP_OIDC_ENABLED:false}
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:https://keycloak.example.com}/realms/${KEYCLOAK_REALM:mcp}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:mcp-redhat-kb}
quarkus.oidc.application-type=service

# Audience validation (RFC 8707). The specification requires rejecting tokens that were
# not issued for this server: without this check, any token signed by the same realm --
# including one minted for a different service -- would be accepted (confused deputy).
# Setting this property is what enables audience verification for access tokens at all:
# quarkus-oidc skips the check when it is absent.
quarkus.oidc.token.audience=${KEYCLOAK_CLIENT_ID:mcp-redhat-kb}

# Publishes /.well-known/oauth-protected-resource (RFC 9728) and returns the
# WWW-Authenticate challenge that points clients at it.
quarkus.oidc.resource-metadata.enabled=true

quarkus.oidc.roles.role-claim-path=realm_access/roles

# Every MCP endpoint requires a valid token, including the discovery and tools/list calls.
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=authenticated
quarkus.http.auth.permission.mcp.auth-mechanism=bearer

# The metadata document itself must stay public: clients read it precisely because they
# do not yet have a token.
quarkus.http.auth.permission.public.paths=/.well-known/*
quarkus.http.auth.permission.public.policy=permit

# -----------------------------------------------------------------------------
# Deprecated transport
# -----------------------------------------------------------------------------
# HTTP+SSE was deprecated in specification revision 2025-03-26 and replaced by Streamable
# HTTP. The extension publishes {rootPath}/sse alongside /mcp with no switch of its own, so
# the route is blocked here: a deprecated transport left listening is an unmaintained way
# into the same tools.
#
# Set MCP_ALLOW_LEGACY_SSE=true only while migrating a client that cannot yet speak
# Streamable HTTP.
quarkus.http.auth.permission.legacy-sse.paths=/mcp/sse,/mcp/sse/*
quarkus.http.auth.permission.legacy-sse.policy=${MCP_LEGACY_SSE_POLICY:deny}

# -----------------------------------------------------------------------------
# Red Hat API Configuration
# -----------------------------------------------------------------------------

# Shared offline token, used only for callers who supply none of their own.
# Generate at: https://access.redhat.com/management/api
redhat.api.offline-token=${REDHAT_TOKEN:}

# Per-user credentials.
# Callers may send their own Red Hat offline token in the X-Red-Hat-Token header; the
# Knowledge Base is then read with their entitlements and Red Hat's audit trail records
# them individually.
#
# Set this to true to REQUIRE it. The shared token above is then never used to serve a
# request, so nobody can read subscription content through another account.
#
# Applies to the HTTP transport only. Over stdio the client launches this process and
# passes REDHAT_TOKEN through its own environment, so that value is already the caller's
# personal credential: there is no second user to isolate them from, and no header to
# carry a different token. The setting is ignored there, with a warning at startup.
redhat.api.require-user-token=${MCP_REQUIRE_USER_TOKEN:false}

# SSO Configuration
redhat.api.sso.token-url=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
redhat.api.sso.client-id=rhsm-api
redhat.api.sso.token-renewal-buffer-seconds=60

# HTTP Timeouts (seconds)
redhat.api.timeouts.connect-seconds=30
redhat.api.timeouts.request-seconds=60

# -----------------------------------------------------------------------------
# Rate limiting
# -----------------------------------------------------------------------------
# Calls per minute per caller, counted per authenticated identity where there is one and
# per credential otherwise. Keeps one runaway agent loop from exhausting the Red Hat
# quota for everyone. Set to 0 to disable.
mcp.rate-limit.calls-per-minute=${MCP_RATE_LIMIT:60}

# -----------------------------------------------------------------------------
# Caching
# -----------------------------------------------------------------------------
# Knowledge Base content changes rarely; caching avoids repeated round trips to Hydra
# when the model refines a search or reopens an article.
quarkus.cache.caffeine."kb-search".maximum-size=200
quarkus.cache.caffeine."kb-search".expire-after-write=15M
quarkus.cache.caffeine."kb-article".maximum-size=100
quarkus.cache.caffeine."kb-article".expire-after-write=30M

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."io.quarkiverse.mcp".level=INFO
quarkus.log.category."com.redhat.kb".level=INFO

# -----------------------------------------------------------------------------
# Transport Configuration
# -----------------------------------------------------------------------------
# Two transports are supported:
#   - stdio: for local MCP clients (VS Code, Cursor, Windsurf).
#       -Dquarkus.mcp.server.stdio.enabled=true -Dquarkus.http.host-enabled=false
#   - Streamable HTTP: endpoint /mcp. This is the only HTTP transport in the current
#     specification; the deprecated HTTP+SSE route is blocked (see below).
#
# The server negotiates per request, so stateless clients (specification 2026-07-28, which
# uses server/discover and carries the protocol version on every call) and older stateful
# clients are both served on the same endpoint.
#
# Default: HTTP enabled, STDIO disabled
quarkus.mcp.server.stdio.enabled=false

# -----------------------------------------------------------------------------
# Development profile
# -----------------------------------------------------------------------------
%dev.quarkus.mcp.server.traffic-logging.enabled=true
%dev.quarkus.log.category."com.redhat.kb".level=DEBUG
# Dev runs without Keycloak; never carry this into another profile.
%dev.quarkus.oidc.enabled=false
%test.quarkus.oidc.enabled=false

# -----------------------------------------------------------------------------
# Native Build Optimizations
# -----------------------------------------------------------------------------
quarkus.native.resources.includes=**/*.properties

# Enable SSL/TLS for native builds (required for HTTPS connections to Red Hat APIs)
quarkus.native.enable-https-url-handler=true
quarkus.native.additional-build-args=--enable-url-protocols=https
