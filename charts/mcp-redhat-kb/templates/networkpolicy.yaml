{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-redhat-kb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-redhat-kb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-redhat-kb.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.allowedSources }}
    - from:
        {{- tpl (toYaml .Values.networkPolicy.allowedSources) . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- else }}
    # No sources configured: ingress is denied. Populate networkPolicy.allowedSources
    # with the selectors of the clients that should reach this server.
    []
    {{- end }}
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS to the Red Hat SSO and Hydra APIs
    - ports:
        - protocol: TCP
          port: 443
{{- end }}
