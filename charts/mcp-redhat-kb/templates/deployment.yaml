{{- if and .Values.ingress.enabled (not .Values.oidc.enabled) }}
{{- fail "Refusing to publish an unauthenticated MCP server: set oidc.enabled=true, or disable the Ingress. This server holds a Red Hat offline token, so an open endpoint lets anyone spend your subscription." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-redhat-kb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-redhat-kb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-redhat-kb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- tpl (toYaml .) . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mcp-redhat-kb.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- tpl (toYaml .) . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- tpl (toYaml .) . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mcp-redhat-kb.serviceAccountName" . }}
      securityContext:
        {{- tpl (toYaml (mergeOverwrite (deepCopy .Values.defaultPodSecurityContext) .Values.podSecurityContext)) . | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- tpl (toYaml (mergeOverwrite (deepCopy .Values.defaultSecurityContext) .Values.securityContext)) . | nindent 12 }}
          image: "{{ include "mcp-redhat-kb.image" (dict "image" .Values.image "chartAppVersion" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: QUARKUS_HTTP_PORT
              value: "{{ .Values.service.port }}"
            - name: QUARKUS_HTTP_HOST
              value: "0.0.0.0"
            - name: MCP_OIDC_ENABLED
              value: {{ .Values.oidc.enabled | quote }}
            - name: MCP_REQUIRE_USER_TOKEN
              value: {{ .Values.redhat.requireUserToken | quote }}
            {{- if .Values.oidc.enabled }}
            - name: KEYCLOAK_URL
              value: {{ required "oidc.url is required when oidc.enabled=true" .Values.oidc.url | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.oidc.realm | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            {{- end }}
            {{- with .Values.allowedOrigins }}
            - name: MCP_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if or .Values.redhat.existingSecret .Values.redhat.token }}
            - name: REDHAT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-redhat-kb.secretName" . }}
                  key: REDHAT_TOKEN
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          volumeMounts:
            # The root filesystem is read-only, so the JVM needs a writable scratch dir.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
      {{- with .Values.extraContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
